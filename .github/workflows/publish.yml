name: Build and push to Docker Hub - latest

on: [workflow_dispatch]

jobs:
  publish:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@master

    - name: Docker login
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Docker build
      run: docker build -t fretje/crystalreportsruntime:latest --isolation hyperv .

    - name: Docker push
      run: docker image push fretje/crystalreportsruntime:latest
